# Direct package installation in a custom userspace, supervised by kiosk.service.
# Use the live system bus and leave shutdown to kiosk.service.
# kiosk-anaconda reapplies this file after Anaconda processes its options.
[Installation System]
type = LIVE_OS

[Installation Target]
can_copy_input_kickstart = False
can_save_output_kickstart = False
can_save_installation_logs = False
