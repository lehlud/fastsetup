# Direct package installation in a custom userspace, supervised by kiosk.service.
# UNKNOWN prevents Anaconda's exit handler from rebooting on early failure.
# Live network/keyboard and shutdown belong to the kiosk, target setup to KS.
[Installation System]
type = UNKNOWN

[Installation Target]
can_copy_input_kickstart = False
can_save_output_kickstart = False
can_save_logs = False
